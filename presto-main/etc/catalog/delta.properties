connector.name=delta
hive.metastore.uri=thrift://localhost:9083

# Hive metastore configuration
# hive.metastore=file
# hive.metastore.catalog.dir=file:///tmp/delta-catalog

# Delta-specific configuration

# Enable Parquet dereference pushdown (default: true)
# delta.parquet-dereference-pushdown-enabled=true

# Case-sensitive partition names (default: true)
# delta.case-sensitive-partitions-enabled=true

# Maximum number of splits to batch (default: 200)
# delta.max-splits-batch-size=200

# Note: Timestamp handling in Delta tables is controlled by the system-level
# 'legacy_timestamp' session property. For proper timestamp adjustment to
# session timezone (recommended for Delta tables with timestamp partitions),
# users should set:
#   SET SESSION legacy_timestamp = true;
# This is the default behavior in Presto.
